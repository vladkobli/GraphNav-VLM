controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

    odom_topic: "/panther/odometry/filtered"
    cmd_vel_topic: "/cmd_vel_nav"
    enable_stamped_cmd_vel: true

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      max_vel_x: 0.25
      min_vel_x: 0.0
      max_vel_y: 0.0
      min_vel_y: 0.0

      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0

      acc_lim_x: 0.4
      decel_lim_x: -0.4
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_theta: -0.8

      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 30

      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0

      xy_goal_tolerance: 0.30
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale: 0.2
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 16.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: panther/odom
      robot_base_frame: panther/base_link
      transform_tolerance: 1.0

      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05

      track_unknown_space: true

      footprint: '[[0.55, 0.48], [0.55, -0.48], [-0.45, -0.48], [-0.45, 0.48]]'
      footprint_padding: 0.05

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1

        observation_sources: velodyne_filtered

        velodyne_filtered:
          topic: /velodyne_points
          data_type: "PointCloud2"

          marking: true
          clearing: true

          min_obstacle_height: 0.05
          max_obstacle_height: 1.80

          obstacle_min_range: 0.25
          obstacle_max_range: 5.0

          raytrace_min_range: 0.25
          raytrace_max_range: 5.5

          observation_persistence: 0.0
          expected_update_rate: 0.0

          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.65
        cost_scaling_factor: 8.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 0.5

      global_frame: map
      robot_base_frame: panther/base_link
      transform_tolerance: 2.0

      rolling_window: false
      resolution: 0.05
      track_unknown_space: true

      footprint: '[[0.55, 0.48], [0.55, -0.48], [-0.45, -0.48], [-0.45, 0.48]]'
      footprint_padding: 0.05

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.75
        cost_scaling_factor: 8.0

      always_send_full_costmap: true

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" ## Use / instead of :: for older ROS distributions
      tolerance: 0.7
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother" 
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    
    spin:
      plugin: "nav2_behaviors::Spin" ## Use / instead of :: for older ROS distributions
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    local_frame: panther/odom
    global_frame: map
    robot_base_frame: panther/base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: panther/base_link
    odom_frame_id: panther/odom
    transform_tolerance: 1.0
    source_timeout: 1.0
    stop_pub_timeout: 2.0

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /panther/cmd_vel
    enable_stamped_cmd_vel: true

    polygons: ["PolygonStop"]
    observation_sources: ["velodyne_filtered"]

    PolygonStop:
      type: "polygon"
      points: "[[0.60, 0.45], [0.60, -0.45], [-0.45, -0.45], [-0.45, 0.45]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/polygon_stop

    velodyne_filtered:
      type: "pointcloud"
      topic: /velodyne_points
      min_height: 0.05
      max_height: 2.0
      enabled: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true

    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    command_topic: "/cmd_vel_nav"
    output_topic: "/cmd_vel_smoothed"
    odom_topic: "/panther/odometry/filtered"

    max_velocity: [0.25, 0.0, 0.8]
    min_velocity: [0.0, 0.0, -0.8]
    max_accel: [0.4, 0.0, 0.8]
    max_decel: [-0.4, 0.0, -0.8]

    odom_topic: "/panther/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0