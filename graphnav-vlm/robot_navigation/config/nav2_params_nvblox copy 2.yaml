# Modified for Husarion Panther with nvblox + skid-steer-safe footprint/turning behavior.
# Goal: reduce wheel/corner clipping in tight environments and avoid early in-place spins.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: panther/base_link
    odom_topic: /odometry/global
    bt_loop_duration: 50
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    ############################################ NVBLOX
