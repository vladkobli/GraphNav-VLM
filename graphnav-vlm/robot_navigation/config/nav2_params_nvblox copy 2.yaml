controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.2
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins:
    - FollowPath
    cmd_vel_topic: /cmd_vel_nav
    use_sim_time: false
    enable_stamped_cmd_vel: true
    odom_topic: "/odometry/local"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      transform_tolerance: 0.5
      desired_linear_vel: 0.18
      lookahead_dist: 0.65
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.95
      lookahead_time: 1.8
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.05
      rotate_to_heading_angular_vel: 0.32
      max_angular_accel: 0.45
      allow_reversing: false
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.85
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.2
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.55
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 6.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0

      global_frame: panther/odom
      robot_base_frame: panther/base_link
      transform_tolerance: 1.0

      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05

      track_unknown_space: false

      # Conservative footprint: physical footprint + wheel/corner clearance margin for skid-steer rotation.
      # If this is too conservative in narrow doors, reduce y from 0.56 to 0.53 first.
      footprint: '[[0.58, 0.56], [0.58, -0.56], [-0.55, -0.56], [-0.55, 0.56]]'
      footprint_padding: 0.04

      plugins: ["nvblox_layer", "denoise_layer"]

      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: true
        nav2_costmap_global_frame: panther/odom
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"

        convert_to_binary_costmap: false

        # Larger nvblox inflation gives RPP/Smac more clearance around table legs and wheel-height obstacles.
        inflation_distance: 0.60
        max_obstacle_distance: 1.00
        max_cost_value: 252

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8


      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 2.0

      global_frame: map
      robot_base_frame: panther/base_link
      transform_tolerance: 1.0

      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05

      track_unknown_space: true

      # Same conservative footprint used by the global planner.
      footprint: '[[0.58, 0.56], [0.58, -0.56], [-0.55, -0.56], [-0.55, 0.56]]'
      footprint_padding: 0.04

      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1

        observation_sources: velodyne_filtered

        velodyne_filtered:
          topic: /velodyne_points_without_roi
          data_type: "PointCloud2"

          marking: true
          clearing: true

          min_obstacle_height: 0.05
          max_obstacle_height: 1.80

          obstacle_min_range: 0.25
          obstacle_max_range: 6.0

          raytrace_min_range: 0.25
          raytrace_max_range: 7.0

          observation_persistence: 0.0
          expected_update_rate: 0.0

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.70
        cost_scaling_factor: 6.0

      always_send_full_costmap: true

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased

    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0
      cost_travel_multiplier: 5.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1e-10
        do_refinement: true
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin" ## Use / instead of :: for older ROS distributions
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    local_frame: panther/odom
    global_frame: map
    robot_base_frame: panther/base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    # Slow recovery spins: skid-steer corners sweep wide arcs near furniture.
    max_rotational_vel: 0.35
    min_rotational_vel: 0.12
    rotational_acc_lim: 0.45

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: panther/base_link
    odom_frame_id: panther/odom
    transform_tolerance: 1.0
    source_timeout: 1.0
    stop_pub_timeout: 2.0

    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /panther/cmd_vel

    polygons:
    - PolygonStop
    - PolygonSlow
    observation_sources: ["velodyne_filtered"]

    PolygonStop:
      type: polygon
      # Covers physical footprint + wheel/corner clearance. Prevents table legs entering the swept corner area.
      points: '[[0.82, 0.68], [0.82, -0.68], [-0.72, -0.68], [-0.72, 0.68]]'
      action_type: stop
      min_points: 2
      visualize: true
      polygon_pub_topic: /collision_monitor/polygon_stop
    velodyne_filtered:
      type: "pointcloud"
      topic: /velodyne_points_without_roi
      min_height: 0.05
      max_height: 2.0
      enabled: true

    enable_stamped_cmd_vel: true
    PolygonSlow:
      type: polygon
      # Larger slowdown envelope so the robot slows before starting a skid-steer pivot near obstacles.
      points: '[[1.30, 0.88], [1.30, -0.88], [-0.90, -0.88], [-0.90, 0.88]]'
      action_type: slowdown
      min_points: 2
      slowdown_ratio: 0.42
      visualize: true
      polygon_pub_topic: /collision_monitor/polygon_slowdown
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity:
    - 0.18
    - 0.0
    - 0.55
    min_velocity:
    - -0.08
    - 0.0
    - -0.55
    max_accel:
    - 0.45
    - 0.0
    - 0.55
    max_decel:
    - -0.45
    - 0.0
    - -0.55
    odom_topic: "/panther/odometry/local"
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
    command_topic: "/cmd_vel_nav"
    output_topic: "/cmd_vel_smoothed"
    enable_stamped_cmd_vel: true