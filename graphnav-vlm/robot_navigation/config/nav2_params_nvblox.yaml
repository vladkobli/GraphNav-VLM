controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    cmd_vel_topic: /panther/cmd_vel
    use_sim_time: false
    enable_stamped_cmd_vel: true
    odom_topic: "/odometry/local"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.3

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0
      acc_lim_x: 0.6
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.6
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 15
      vy_samples: 0
      vtheta_samples: 30
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.3
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0

      global_frame: panther/odom
      robot_base_frame: panther/base_link
      transform_tolerance: 1.0

      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05

      track_unknown_space: false

      footprint: '[[0.45, 0.43], [0.45, -0.43], [-0.40, -0.43], [-0.40, 0.43]]'
      footprint_padding: 0.05

      plugins: ["nvblox_layer","denoise_layer"]

      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: true
        nav2_costmap_global_frame: panther/odom
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"

        convert_to_binary_costmap: false

        inflation_distance: 0.3
        max_obstacle_distance: 0.55
        max_cost_value: 252
      
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: panther/base_link
      transform_tolerance: 1.0

      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05

      track_unknown_space: true

      footprint: '[[0.45, 0.43], [0.45, -0.43], [-0.40, -0.43], [-0.40, 0.43]]'
      footprint_padding: 0.1

      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1

        observation_sources: velodyne_filtered

        velodyne_filtered:
          topic: /velodyne_points_without_roi
          data_type: "PointCloud2"

          marking: true
          clearing: true

          min_obstacle_height: 0.05
          max_obstacle_height: 1.80

          obstacle_min_range: 0.25
          obstacle_max_range: 6.0

          raytrace_min_range: 0.25
          raytrace_max_range: 7.0

          observation_persistence: 0.0
          expected_update_rate: 0.0

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 8.0

      always_send_full_costmap: true

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" ## Use / instead of :: for older ROS distributions
      tolerance: 10.0
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother" 
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    
    spin:
      plugin: "nav2_behaviors::Spin" ## Use / instead of :: for older ROS distributions
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    local_frame: panther/odom
    global_frame: map
    robot_base_frame: panther/base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: panther/base_link
    odom_frame_id: panther/odom
    transform_tolerance: 1.0
    source_timeout: 1.0
    stop_pub_timeout: 2.0

    cmd_vel_in_topic: /panther/cmd_vel
    cmd_vel_out_topic: /panther/cmd_vel

    polygons: ["PolygonStop"]
    observation_sources: ["velodyne_filtered"]

    PolygonStop:
      type: "polygon"
      points: "[[0.60, 0.45], [0.60, -0.45], [-0.45, -0.45], [-0.45, 0.45]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/polygon_stop

    velodyne_filtered:
      type: "pointcloud"
      topic: /velodyne_points_without_roi
      min_height: 0.05
      max_height: 2.0
      enabled: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 0.8]
    min_velocity: [-0.2, 0.0, -0.8]
    max_accel: [1.2, 0.0, 1.0]
    max_decel: [-1.2, 0.0, -1.0]
    odom_topic: "/panther/odometry/local"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    command_topic: "/panther/cmd_vel"
    output_topic: "/cmd_vel_smoothed"
