ublox_gps_node:
  ros__parameters:
    config_on_startup: false
    debug: 0                    # Range 0-4 (0 means no debug statements will print)
    device: /dev/ttyACM0
    frame_id: panther/gps_link
    # frame_id: gps_link        # default
    uart1:
      baudrate: 38400
    # TMODE3 Config
    # tmode3: 1                   # Survey-In Mode
    tmode3: 0      # Disabled → pure rover mode
    sv_in:
      reset: True               # True: disables and re-enables survey-in (resets)
                                # False: Disables survey-in only if TMODE3 is
                                # disabled
      min_dur: 300              # Survey-In Minimum Duration [s]
      acc_lim: 3.0              # Survey-In Accuracy Limit [m]
    
    config_on_startup: false
    rate:     4.0   # 1 Hz measurement rate
    nav_rate: 1   # publish nav solution every 1 measurement
    time_reference: 0         # GPS time

    inf:
      all: false                   # Whether to display all INF messages in console
    
    publish:
      all: true
      aid:
        hui: false
      nav:
        posecef: true
        posllh: true
        PVT: true
      esf: 
        ins: false
        meas: true
        raw: false
        status: false
